[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scam-sniffer"
version = "0.1.0"
description = "Local-first support/resistance analysis for Binance futures"
requires-python = ">=3.12,<3.14"

license = { text = "MIT" }

dependencies = [
  "numpy>=2.0,<3",
  "httpx>=0.28,<1",
  "fastapi>=0.115,<1",
  "websockets>=14,<16",
  "uvicorn[standard]>=0.34,<1",
  "asyncpg>=0.30,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "structlog>=24.4,<26",
  "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
scam-sniffer = "scam_sniffer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scam_sniffer"]
artifacts = ["src/scam_sniffer/data/database/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "ASYNC", "RUF", "D"]
ignore = ["E302", "E305"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["scam_sniffer"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
markers = [
  "integration: requires an external service such as TimescaleDB",
]
testpaths = ["tests"]
